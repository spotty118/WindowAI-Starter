<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChatHub Interceptor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="toolbar">
    <label class="toggle">
      <input type="checkbox" id="enabledToggle">
      <span>Capture enabled</span>
    </label>
    <button id="clearBtn">Clear</button>
    <button id="exportBtn">Export</button>
    <button id="cookiesBtn">Show Cookies</button>
    <select id="filter">
      <option value="all">All</option>
      <option value="fetch">Fetch</option>
      <option value="xhr">XHR</option>
      <option value="ws">WebSocket</option>
      <option value="sse">SSE</option>
    </select>
    <input id="search" placeholder="Search URL">
  </div>
  <div id="cookiesBox" style="display:none; padding:8px;">
    <div class="controls">
      <button id="copyCookieHeaderBtn">Copy Cookie header</button>
      <button id="exportCookiesBtn">Export cookies JSON</button>
    </div>
    <div class="kv" id="cookieHeaderBox"></div>
  </div>
  <div id="logs"></div>
  <script src="popup.js"></script>
</body>
</html>
